<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的英语学习</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px 15px;
    max-width: 600px;
    margin: auto;
}

#word {
    font-size: 42px;
    font-weight: bold;
    margin-top: 30px;
}

#sentence {
    font-size: 24px;
    margin: 25px 0;
}

#answer {
    font-size: 22px;
    margin: 25px 0;
    min-height: 30px;
}

#status {
    font-size: 18px;
    margin: 20px 0;
    color: #555;
}

button {
    font-size: 18px;
    padding: 12px 18px;
    margin: 7px;
    border-radius: 10px;
    border: 1px solid #999;
    background: white;
}

.remember {
    background: #e8f5e9;
}

.forget {
    background: #ffebee;
}

.next {
    background: #e3f2fd;
}

.summary {
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid #ddd;
}
</style>

</head>

<body>

<h1>我的英语学习</h1>

<p id="progress"></p>

<div id="word"></div>

<div id="sentence"></div>

<div id="answer"></div>

<button onclick="showAnswer()">查看答案</button>

<br>

<button class="remember" onclick="rememberWord()">
我记得
</button>

<button class="forget" onclick="forgetWord()">
不记得
</button>

<br>

<button class="next" onclick="nextWord()">
下一题
</button>

<div id="status"></div>

<div class="summary">

<h2>学习记录</h2>

<p id="summary"></p>

</div>

<script>

const words = [

    {
        word: "get",
        sentence: "I get a book.",
        answer: "我得到一本书。"
    },

    {
        word: "give",
        sentence: "I give you a book.",
        answer: "我给你一本书。"
    },

    {
        word: "take",
        sentence: "I take my phone.",
        answer: "我拿上我的手机。"
    },

    {
        word: "bring",
        sentence: "Bring your phone.",
        answer: "带上你的手机。"
    },

    {
        word: "put",
        sentence: "Put the book there.",
        answer: "把书放在那里。"
    }

];

let current = 0;

let records = JSON.parse(
    localStorage.getItem("englishRecords")
) || {};


function showWord() {

    document.getElementById("progress").innerText =
        "第 " + (current + 1) + " / " + words.length + " 题";

    document.getElementById("word").innerText =
        words[current].word;

    document.getElementById("sentence").innerText =
        words[current].sentence;

    document.getElementById("answer").innerText = "";

    showStatus();

    updateSummary();
}


function showAnswer() {

    document.getElementById("answer").innerText =
        words[current].answer;

}


function rememberWord() {

    const word = words[current].word;

    if (!records[word]) {
        records[word] = {
            remembered: 0,
            forgotten: 0
        };
    }

    records[word].remembered++;

    saveRecords();

    showStatus();

    updateSummary();
}


function forgetWord() {

    const word = words[current].word;

    if (!records[word]) {
        records[word] = {
            remembered: 0,
            forgotten: 0
        };
    }

    records[word].forgotten++;

    saveRecords();

    showStatus();

    updateSummary();
}


function saveRecords() {

    localStorage.setItem(
        "englishRecords",
        JSON.stringify(records)
    );

}


function showStatus() {

    const word = words[current].word;

    const record = records[word];

    if (!record) {

        document.getElementById("status").innerText =
            "这个词还没有学习记录。";

        return;
    }

    document.getElementById("status").innerText =
        "我记得：" + record.remembered +
        " 次　|　不记得：" + record.forgotten + " 次";

}


function updateSummary() {

    let rememberedTotal = 0;
    let forgottenTotal = 0;

    for (const word in records) {

        rememberedTotal +=
            records[word].remembered;

        forgottenTotal +=
            records[word].forgotten;

    }

    document.getElementById("summary").innerText =
        "记得：" + rememberedTotal +
        " 次　　不记得：" + forgottenTotal + " 次";

}


function nextWord() {

    current++;

    if (current >= words.length) {
        current = 0;
    }

    showWord();

}


showWord();

</script>

</body>
</html>
