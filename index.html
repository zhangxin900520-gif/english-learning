<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>我的英语学习</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 25px 15px;
    max-width: 650px;
    margin: auto;
    line-height: 1.6;
}

h1 {
    margin-bottom: 20px;
}

.menu {
    margin: 15px 0;
}

#mode {
    font-size: 20px;
    margin: 15px 0;
}

#progress {
    color: #666;
}

#word {
    font-size: 42px;
    font-weight: bold;
    margin-top: 30px;
}

#meaning {
    font-size: 20px;
    color: #666;
    margin-top: 5px;
}

#sentence {
    font-size: 25px;
    margin: 25px 0;
}

#answer {
    font-size: 22px;
    margin: 20px 0;
    min-height: 35px;
}

#status {
    font-size: 18px;
    margin: 20px 0;
    color: #555;
}

button {
    font-size: 18px;
    padding: 11px 17px;
    margin: 6px;
    border-radius: 10px;
    border: 1px solid #999;
    background: white;
}

.modeButton {
    background: #e3f2fd;
}

.remember {
    background: #e8f5e9;
}

.forget {
    background: #ffebee;
}

.next {
    background: #e3f2fd;
}

.review {
    background: #fff3cd;
}

.summary {
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid #ddd;
}

</style>

</head>

<body>

<h1>我的英语学习</h1>

<div class="menu">

<button class="modeButton"
onclick="wordMode()">
单词学习
</button>

<button class="modeButton"
onclick="sentenceMode()">
句子理解
</button>

<button class="review"
onclick="reviewMode()">
重点复习
</button>

</div>

<div id="mode">
单词学习
</div>

<p id="progress"></p>

<div id="word"></div>

<div id="meaning"></div>

<div id="sentence"></div>

<div id="answer"></div>

<button onclick="showAnswer()">
查看答案
</button>

<br>

<button class="remember"
onclick="rememberItem()">
我看懂了
</button>

<button class="forget"
onclick="forgetItem()">
没看懂
</button>

<br>

<button class="next"
onclick="nextQuestion()">
下一题
</button>

<div id="status"></div>

<div class="summary">

<h2>学习记录</h2>

<p id="summary"></p>

</div>


<script>

    {

        answer: "我想要一本书。"
    },

    {

    {

    },

    },

    {

        answer: "带上你的手机。"
    },

    {
        word: "put",
        meaning: "放",
        sentence: "Put the book there.",
        answer: "把书放在那里。"
    },

    {
        word: "open",
        meaning: "打开",
        sentence: "Open the book.",
        answer: "打开这本书。"
    },

    {
        word: "close",
        meaning: "关闭",
        sentence: "Close the book.",
        answer: "合上这本书。"
    },

    {
        word: "read",
        meaning: "阅读",
        sentence: "I read the book.",
        answer: "我阅读这本书。"
    },

    {
        word: "need",
        meaning: "需要",
        sentence: "I need my phone.",
        answer: "我需要我的手机。"
    },

    {
        word: "take",
        meaning: "拿、带走",
        sentence: "I take my phone.",
        answer: "我拿上我的手机。"
    },

    {
        word: "stay",
        meaning: "待、停留",
        sentence: "I stay at home.",
        answer: "我待在家里。"
    },

    {
        word: "wait",
        meaning: "等待",
        sentence: "I wait for my friend.",
        answer: "我等我的朋友。"
    },

    {
        word: "together",
        meaning: "一起",
        sentence: "We read together.",
        answer: "我们一起阅读。"
    },

    {
        word: "start",
        meaning: "开始",
        sentence: "They start to go home.",
        answer: "他们开始回家。"
    },

    {
        word: "again",
        meaning: "再一次",
        sentence: "I read it again.",
        answer: "我再读一遍。"
    },

    {
        word: "find",
        meaning: "找到",
        sentence: "I can't find my phone.",
        answer: "我找不到我的手机。"
    },

    {
        word: "help",
        meaning: "帮助",
        sentence: "Can you help me?",
        answer: "你能帮助我吗？"
    },

    {
        word: "call",
        meaning: "打电话、呼叫",
        sentence: "Call me later.",
        answer: "晚些时候给我打电话。"
    },

    {
        word: "later",
        meaning: "以后、稍后",
        sentence: "Call me later.",
        answer: "晚些时候给我打电话。"
    },

    {
        word: "finish",
        meaning: "完成",
        sentence: "I finished reading the book.",
        answer: "我读完了这本书。"
    }

];


/* =========================
   句子理解
========================= */

const sentenceTests = [

    {
        sentence: "I get a book.",
        answer: "我得到一本书。"
    },

    {
        sentence: "I give you a book.",
        answer: "我给你一本书。"
    },

    {
        sentence: "I use my phone.",
        answer: "我使用我的手机。"
    },

    {
        sentence: "Come here.",
        answer: "来这里。"
    },

    {
        sentence: "Look here.",
        answer: "看这里。"
    },

    {
        sentence: "I see my friend.",
        answer: "我看见我的朋友。"
    },

    {
        sentence: "I go to work.",
        answer: "我去上班。"
    },

    {
        sentence: "I want this book.",
        answer: "我想要这本书。"
    },

    {
        sentence: "I like this book.",
        answer: "我喜欢这本书。"
    },

    {
        sentence: "I live here.",
        answer: "我住在这里。"
    },

    {
        sentence: "Put the book there.",
        answer: "把书放在那里。"
    },

    {
        sentence: "Bring your phone.",
        answer: "带上你的手机。"
    },

    {
        sentence: "Open the book.",
        answer: "打开这本书。"
    },

    {
        sentence: "Close the book.",
        answer: "合上这本书。"
    },

    {
        sentence: "I read the book.",
        answer: "我阅读这本书。"
    },

    {
        sentence: "I need my phone.",
        answer: "我需要我的手机。"
    },

    {
        sentence: "I stay at home.",
        answer: "我待在家里。"
    },

    {
        sentence: "I wait for my friend.",
        answer: "我等我的朋友。"
    },

    {
        sentence: "We read together.",
        answer: "我们一起阅读。"
    },

    {
        sentence: "They start to go home.",
        answer: "他们开始回家。"
    },

    {
        sentence: "I read it again.",
        answer: "我再读一遍。"
    },

    {
        sentence: "I can't find my phone.",
        answer: "我找不到我的手机。"
    },

    {
        sentence: "Can you help me?",
        answer: "你能帮助我吗？"
    },

    {
        sentence: "Call me later.",
        answer: "晚些时候给我打电话。"
    },

    {
        sentence: "I finished reading the book.",
        answer: "我读完了这本书。"
    },

    {
        sentence: "I begin reading.",
        answer: "我开始阅读。"
    }

];


/* =========================
   程序状态
========================= */

let mode = "word";

let current = 0;

let reviewList = [];

let reviewPosition = 0;

let records = JSON.parse(
    localStorage.getItem("englishRecords")
) || {};


/* =========================
   模式切换
========================= */

function wordMode() {

    mode = "word";
    current = 0;

    document.getElementById("mode").innerText =
        "单词学习";

    showQuestion();
}


function sentenceMode() {

    mode = "sentence";
    current = 0;

    document.getElementById("mode").innerText =
        "句子理解";

    showQuestion();
}


/* =========================
   显示题目
========================= */

function showQuestion() {

    let question;

    let total;

    if (mode === "word") {

        question = words[current];
        total = words.length;

        document.getElementById("word").innerText =
            question.word;

        document.getElementById("meaning").innerText =
            "";

    } else {

        question = sentenceTests[current];
        total = sentenceTests.length;

        document.getElementById("word").innerText =
            "句子";

        document.getElementById("meaning").innerText =
            "";

    }

    document.getElementById("progress").innerText =
        "第 " + (current + 1) +
        " / " + total;

    document.getElementById("sentence").innerText =
        question.sentence;

    document.getElementById("answer").innerText =
        "";

    showStatus();
}


/* =========================
   查看答案
========================= */

function showAnswer() {

    let question;

    if (mode === "word") {

        question = words[current];

        document.getElementById("answer").innerText =
            question.answer;

        document.getElementById("meaning").innerText =
            question.meaning;

    } else {

        question = sentenceTests[current];

        document.getElementById("answer").innerText =
            question.answer;

    }
}


/* =========================
   取得当前记录名称
========================= */

function getCurrentKey() {

    if (mode === "word") {

        return words[current].word;

    }

    return "句子：" +
        sentenceTests[current].sentence;

}


/* =========================
   记录看懂
========================= */

function rememberItem() {

    const key = getCurrentKey();

    if (!records[key]) {

        records[key] = {
            remembered: 0,
            forgotten: 0
        };

    }

    records[key].remembered++;

    saveRecords();

    showStatus();

    updateSummary();

}


/* =========================
   记录没看懂
========================= */

function forgetItem() {

    const key = getCurrentKey();

    if (!records[key]) {

        records[key] = {
            remembered: 0,
            forgotten: 0
        };

    }

    records[key].forgotten++;

    saveRecords();

    showStatus();

    updateSummary();

}


/* =========================
   保存记录
========================= */

function saveRecords() {

    localStorage.setItem(
        "englishRecords",
        JSON.stringify(records)
    );

}


/* =========================
   显示当前记录
========================= */

function showStatus() {

    const key = getCurrentKey();

    const record = records[key];

    if (!record) {

        document.getElementById("status").innerText =
            "还没有学习记录。";

        return;
    }

    document.getElementById("status").innerText =
        "看懂：" +
        record.remembered +
        " 次　|　没看懂：" +
        record.forgotten +
        " 次";

}


/* =========================
   总记录
========================= */

function updateSummary() {

    let rememberedTotal = 0;

    let forgottenTotal = 0;

    for (const key in records) {

        rememberedTotal +=
            records[key].remembered;

        forgottenTotal +=
            records[key].forgotten;

    }

    document.getElementById("summary").innerText =
        "看懂：" +
        rememberedTotal +
        " 次　　没看懂：" +
        forgottenTotal +
        " 次";

}


/* =========================
   下一题
========================= */

function nextQuestion() {

    const total =
        mode === "word"
        ? words.length
        : sentenceTests.length;

    current++;

    if (current >= total) {

        current = 0;

    }

    showQuestion();

}


/* =========================
   重点复习
========================= */

function reviewMode() {

    reviewList = [];

    for (let i = 0; i < words.length; i++) {

        const key = words[i].word;

        const record = records[key];

        if (record && record.forgotten > 0) {

            reviewList.push({

                type: "word",

                index: i,

                forgotten: record.forgotten

            });

        }
    }


    for (let i = 0; i < sentenceTests.length; i++) {

        const key =
            "句子：" +
            sentenceTests[i].sentence;

        const record = records[key];

        if (record && record.forgotten > 0) {

            reviewList.push({

                type: "sentence",

                index: i,

                forgotten: record.forgotten

            });

        }
    }


    if (reviewList.length === 0) {

        alert("目前还没有需要重点复习的内容。");

        return;
    }


    reviewList.sort(function(a, b) {

        return b.forgotten - a.forgotten;

    });


    reviewPosition = 0;

    mode = "review";

    document.getElementById("mode").innerText =
        "重点复习";

    showReviewQuestion();

}


/* =========================
   显示重点复习
========================= */

function showReviewQuestion() {

    const item =
        reviewList[reviewPosition];

    let question;


    if (item.type === "word") {

        question = words[item.index];

        document.getElementById("word").innerText =
            question.word;

        document.getElementById("meaning").innerText =
            "";

    } else {

        question = sentenceTests[item.index];

        document.getElementById("word").innerText =
            "句子";

        document.getElementById("meaning").innerText =
            "";

    }


    document.getElementById("sentence").innerText =
        question.sentence;

    document.getElementById("answer").innerText =
        "";

    document.getElementById("progress").innerText =
        "重点复习 " +
        (reviewPosition + 1) +
        " / " +
        reviewList.length;

    showReviewStatus();

}


/* =========================
   重点复习的记录
========================= */

function getReviewKey() {

    const item =
        reviewList[reviewPosition];

    if (item.type === "word") {

        return words[item.index].word;

    }

    return "句子：" +
        sentenceTests[item.index].sentence;

}


function showReviewStatus() {

    const key = getReviewKey();

    const record = records[key];

    if (!record) {

        document.getElementById("status").innerText =
            "还没有学习记录。";

        return;
    }

    document.getElementById("status").innerText =
        "看懂：" +
        record.remembered +
        " 次　|　没看懂：" +
        record.forgotten +
        " 次";

}


showQuestion();

updateSummary();

</script>

</body>
</html>
