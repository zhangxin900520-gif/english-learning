<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>我的英语学习</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px 15px;
    max-width: 600px;
    margin: auto;
}

h1 {
    margin-bottom: 25px;
}

#mode {
    font-size: 20px;
    margin: 15px;
}

#progress {
    color: #666;
}

#word {
    font-size: 42px;
    font-weight: bold;
    margin-top: 30px;
}

#sentence {
    font-size: 25px;
    margin: 25px 0;
}

#answer {
    font-size: 22px;
    margin: 25px 0;
    min-height: 30px;
}

#status {
    font-size: 18px;
    margin: 20px 0;
    color: #555;
}

button {
    font-size: 18px;
    padding: 12px 18px;
    margin: 7px;
    border-radius: 10px;
    border: 1px solid #999;
    background: white;
}

.modeButton {
    background: #e3f2fd;
}

.remember {
    background: #e8f5e9;
}

.forget {
    background: #ffebee;
}

.next {
    background: #e3f2fd;
}

.review {
    background: #fff3cd;
}

.summary {
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid #ddd;
}

.hidden {
    display: none;
}

</style>

</head>

<body>

<h1>我的英语学习</h1>

<div id="mode">
    单词学习
</div>

<button class="modeButton"
onclick="wordMode()">
单词学习
</button>

<button class="modeButton"
onclick="sentenceMode()">
句子理解
</button>

<p id="progress"></p>

<div id="word"></div>

<div id="sentence"></div>

<div id="answer"></div>

<button onclick="showAnswer()">
查看答案
</button>

<br>

<button class="remember"
onclick="rememberWord()">
我看懂了
</button>

<button class="forget"
onclick="forgetWord()">
没看懂
</button>

<br>

<button class="next"
onclick="nextQuestion()">
下一题
</button>

<div id="status"></div>

<div class="summary">

<h2>学习记录</h2>

<p id="summary"></p>

</div>

<script>

const words = [

    {
        word: "get",
        sentence: "I get a book.",
        answer: "我得到一本书。"
    },

    {
        word: "give",
        sentence: "I give you a book.",
        answer: "我给你一本书。"
    },

    {
        word: "take",
        sentence: "I take my phone.",
        answer: "我拿上我的手机。"
    },

    {
        word: "bring",
        sentence: "Bring your phone.",
        answer: "带上你的手机。"
    },

    {
        word: "put",
        sentence: "Put the book there.",
        answer: "把书放在那里。"
    }

];


const sentenceTests = [

    {
        sentence: "I get a book.",
        answer: "我得到一本书。"
    },

    {
        sentence: "I give you a book.",
        answer: "我给你一本书。"
    },

    {
        sentence: "I take my phone.",
        answer: "我拿上我的手机。"
    },

    {
        sentence: "Bring your phone.",
        answer: "带上你的手机。"
    },

    {
        sentence: "Put the book there.",
        answer: "把书放在那里。"
    },

    {
        sentence: "I give you my phone.",
        answer: "我把我的手机给你。"
    },

    {
        sentence: "I take the book.",
        answer: "我拿这本书。"
    },

    {
        sentence: "Put your phone there.",
        answer: "把你的手机放在那里。"
    },

    {
        sentence: "Bring the book.",
        answer: "把书带来。"
    },

    {
        sentence: "I get the book.",
        answer: "我拿到这本书。"
    }

];


let mode = "word";

let current = 0;

let records = JSON.parse(
    localStorage.getItem("englishRecords")
) || {};


function wordMode() {

    mode = "word";

    current = 0;

    document.getElementById("mode").innerText =
        "单词学习";

    showQuestion();

}


function sentenceMode() {

    mode = "sentence";

    current = 0;

    document.getElementById("mode").innerText =
        "句子理解";

    showQuestion();

}


function getCurrentQuestion() {

    if (mode === "word") {
        return words[current];
    }

    return sentenceTests[current];

}


function showQuestion() {

    const question = getCurrentQuestion();

    const total =
        mode === "word"
        ? words.length
        : sentenceTests.length;

    document.getElementById("progress").innerText =
        "第 " + (current + 1) +
        " / " + total;

    if (mode === "word") {

        document.getElementById("word").innerText =
            question.word;

    } else {

        document.getElementById("word").innerText =
            "句子";

    }

    document.getElementById("sentence").innerText =
        question.sentence;

    document.getElementById("answer").innerText = "";

    document.getElementById("status").innerText =
        "";

}


function showAnswer() {

    const question = getCurrentQuestion();

    document.getElementById("answer").innerText =
        question.answer;

}


function rememberWord() {

    const key =
        mode === "word"
        ? words[current].word
        : "句子：" + sentenceTests[current].sentence;

    if (!records[key]) {

        records[key] = {
            remembered: 0,
            forgotten: 0
        };

    }

    records[key].remembered++;

    saveRecords();

    showStatus();

    updateSummary();

}


function forgetWord() {

    const key =
        mode === "word"
        ? words[current].word
        : "句子：" + sentenceTests[current].sentence;

    if (!records[key]) {

        records[key] = {
            remembered: 0,
            forgotten: 0
        };

    }

    records[key].forgotten++;

    saveRecords();

    showStatus();

    updateSummary();

}


function showStatus() {

    const key =
        mode === "word"
        ? words[current].word
        : "句子：" + sentenceTests[current].sentence;

    const record = records[key];

    if (!record) {

        document.getElementById("status").innerText =
            "还没有学习记录。";

        return;

    }

    document.getElementById("status").innerText =
        "看懂：" + record.remembered +
        " 次　|　没看懂：" +
        record.forgotten + " 次";

}


function updateSummary() {

    let rememberedTotal = 0;

    let forgottenTotal = 0;

    for (const key in records) {

        rememberedTotal +=
            records[key].remembered;

        forgottenTotal +=
            records[key].forgotten;

    }

    document.getElementById("summary").innerText =
        "看懂：" + rememberedTotal +
        " 次　　没看懂：" +
        forgottenTotal + " 次";

}


function saveRecords() {

    localStorage.setItem(
        "englishRecords",
        JSON.stringify(records)
    );

}


function nextQuestion() {

    const total =
        mode === "word"
        ? words.length
        : sentenceTests.length;

    current++;

    if (current >= total) {
        current = 0;
    }

    showQuestion();

}


showQuestion();

</script>

</body>
</html>
